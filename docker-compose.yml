name: lab-brain

# Manages the FastAPI app only. LiveKit, Ollama, and Supabase are started
# and managed separately by start_services.sh — this just needs to reach
# them on the host, the same way the app does when run with `python main.py`
# outside Docker.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-brain-backend
    ports:
      - "8000:8000"
    env_file:
      # Injected as real container env vars (not a file copied into the
      # image). There is no core/config.py / config.json anymore — every
      # pipeline/, services/, api/, and db/ module reads its own env vars
      # directly from os.environ at import time (see core/env.py /
      # README.md's Environment Variables section for the full list), so
      # .env is now the single source of truth for all of it, not just a
      # handful of values.
      - .env
    environment:
      # ── Host-reachability overrides ─────────────────────────────────────
      # Everything else needed by the app comes from .env above. These two
      # are called out separately because they're a special case: .env
      # typically points at a LAN/Tailscale address for LiveKit/Ollama (so
      # the same file works for `python main.py` run directly on the host),
      # but from *inside* this container that address may not be routable.
      # host.docker.internal always reaches the host here (see extra_hosts
      # below), since start_services.sh publishes both LiveKit and Ollama
      # on the host's network with -p flags. If your .env's LIVEKIT_URL /
      # LOCAL_LLM_BASE_URL already resolve from inside a container as-is
      # (e.g. real hostnames, not a Tailscale IP tied to the host machine),
      # you can drop these two overrides and let .env's values pass through
      # unmodified.
      #
      # LIVEKIT_API_KEY / LIVEKIT_API_SECRET are NOT overridden here — they
      # come from .env as secrets, and must match whatever start_services.sh's
      # LiveKit container was actually started with.
      - LIVEKIT_URL=ws://host.docker.internal:7880
      - LOCAL_LLM_BASE_URL=http://host.docker.internal:11434/v1
    volumes:
      # Shared with the lab-brain-egress container (see start_services.sh's
      # start_egress()) — egress writes finished recordings here instead of
      # uploading via S3 directly (self-hosted Supabase Storage's S3
      # protocol has an unresolved signature-verification bug; see the
      # comment above RECORDINGS_MOUNT in pipeline/livekit_rooms.py).
      # This app picks the file up from here and uploads it via the JWT
      # Storage API instead. `external: true` below because
      # start_services.sh creates this volume (`docker volume create`), not
      # this compose file — if you run this compose file before ever
      # running start_services.sh, create it manually first:
      #   docker volume create lab-brain-recordings
      - lab-brain-recordings:/recordings
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop for
      # Mac/Windows already provides it). Needed because start_services.sh's
      # containers are published on the HOST's network, not this compose
      # file's — 127.0.0.1/localhost inside this container refers to the
      # container itself, not the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  lab-brain-recordings:
    external: true