[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally left blank — app/db/migrations.py sets it
# at runtime from the SUPABASE_DB_URL env var. If you run the `alembic` CLI
# directly instead of going through app/db/migrations.py, export it first:
#   export SUPABASE_DB_URL="postgresql+asyncpg://postgres:<pw>@db.<ref>.supabase.co:5432/postgres"
#   alembic -x url=$SUPABASE_DB_URL upgrade head
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S